[project]
name = "hermes-ops"
version = "0.2.0"
description = "FastMCP server exposing Gmail retrieval, durable classification, and calendar manipulation to the Hermes agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "google-api-python-client>=2.140",
    "google-auth>=2.33",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "python-dateutil>=2.9",
    "cryptography>=43",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[project.scripts]
hermes-ops = "hermes_ops.server:main"
hermes-ops-auth = "hermes_ops.auth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
